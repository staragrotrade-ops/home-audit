name: Add dependency (temporary)

on:
  push:
    branches: ['deps/**']

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install pdf-lib@1.17.1 --save-exact
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/add-dependency.yml
          git add package.json package-lock.json
          git commit -m "Add pdf-lib 1.17.1"
          git push
