name: Verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:release
      - name: TEMP show gate errors
        if: failure()
        run: |
          node scripts/release-gate.mjs > gate.log 2>&1 || true
          grep -vE "^\s*$" gate.log | grep -iE "assert|error|expected|fail|✖|not ok|at " | head -30 | while IFS= read -r line; do echo "::error::$line"; done
