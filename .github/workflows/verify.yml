name: Verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:release
      - name: TEMP show build errors
        if: failure()
        run: |
          npm run build > build.log 2>&1 || true
          grep -nE "Error|error|Type |\.tsx?:" build.log | head -25 | while IFS= read -r line; do echo "::error::$line"; done
